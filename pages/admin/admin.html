<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面 - Makase-supa</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/assets/css/style.css" rel="stylesheet">
    <link href="/assets/css/admin/admin.css" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <div id="header"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 px-0 sidebar">
                <div class="py-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-shield fa-3x mb-2"></i>
                        <h5 id="adminName">管理者</h5>
                        <small class="text-white-50" id="adminRole">ADMIN</small>
                    </div>
                    <nav class="nav flex-column">
                        <a class="nav-link active" href="#dashboard" onclick="showSection('dashboard')">
                            <i class="fas fa-tachometer-alt"></i> ダッシュボード
                        </a>
                        <a class="nav-link" href="#products" onclick="showSection('products')">
                            <i class="fas fa-box"></i> 商品管理
                        </a>
                        <a class="nav-link" href="#orders" onclick="showSection('orders')">
                            <i class="fas fa-shopping-cart"></i> 注文管理
                        </a>
                        <a class="nav-link" href="#categories" onclick="showSection('categories')">
                            <i class="fas fa-tags"></i> カテゴリー管理
                        </a>
                        <a class="nav-link" href="#reviews" onclick="showSection('reviews')">
                            <i class="fas fa-star"></i> レビュー管理
                        </a>
                        <hr class="text-white">
                        <a class="nav-link" href="/pages/user/index.html">
                            <i class="fas fa-home"></i> サイトに戻る
                        </a>
                    </nav>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 admin-content">
                <div class="py-4">
                    <!-- Dashboard Section -->
                    <div id="dashboard" class="admin-section">
                        <h2 class="mb-4"><i class="fas fa-tachometer-alt"></i> ダッシュボード</h2>

                        <!-- Stats Cards -->
                        <div class="row g-4 mb-4">
                            <div class="col-md-3">
                                <div class="card stat-card border-primary" onclick="showSection('orders')">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h6 class="text-muted mb-1">総注文数</h6>
                                                <h3 id="totalOrders">
                                                    <div class="spinner-border spinner-border-sm"></div>
                                                </h3>
                                            </div>
                                            <i class="fas fa-shopping-cart fa-2x text-primary"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card stat-card border-success">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h6 class="text-muted mb-1">総売上</h6>
                                                <h3 id="totalRevenue">
                                                    <div class="spinner-border spinner-border-sm"></div>
                                                </h3>
                                            </div>
                                            <i class="fas fa-yen-sign fa-2x text-success"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card stat-card border-info" onclick="showSection('products')">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h6 class="text-muted mb-1">商品数</h6>
                                                <h3 id="totalProducts">
                                                    <div class="spinner-border spinner-border-sm"></div>
                                                </h3>
                                            </div>
                                            <i class="fas fa-box fa-2x text-info"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card stat-card border-warning" onclick="showSection('categories')">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h6 class="text-muted mb-1">カテゴリー数</h6>
                                                <h3 id="totalCategories">
                                                    <div class="spinner-border spinner-border-sm"></div>
                                                </h3>
                                            </div>
                                            <i class="fas fa-tags fa-2x text-warning"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Recent Orders -->
                        <div class="card mb-4">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                                <h5 class="mb-0"><i class="fas fa-clock"></i> 最近の注文 (10件)</h5>
                                <a href="#orders" onclick="showSection('orders')" class="btn btn-sm btn-primary">
                                    すべて表示
                                </a>
                            </div>
                            <div class="card-body">
                                <div id="recentOrders">
                                    <div class="text-center py-3">
                                        <div class="spinner-border" role="status"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Low Stock Products -->
                        <div class="card">
                            <div class="card-header bg-white">
                                <h5 class="mb-0"><i class="fas fa-exclamation-triangle text-warning"></i> 在庫が少ない商品</h5>
                            </div>
                            <div class="card-body">
                                <div id="lowStockProducts">
                                    <div class="text-center py-3">
                                        <div class="spinner-border" role="status"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Products Section -->
                    <div id="products" class="admin-section d-none">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2><i class="fas fa-box"></i> 商品管理</h2>
                            <a href="/admin-product-edit.html" class="btn btn-primary">
                                <i class="fas fa-plus"></i> 商品を追加
                            </a>
                        </div>

                        <!-- Search & Filter -->
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-5">
                                        <input type="text" class="form-control" id="productSearch"
                                            placeholder="商品名で検索..." onkeypress="handleSearchKeyPress(event)">
                                    </div>
                                    <div class="col-md-3">
                                        <select class="form-select" id="productCategoryFilter">
                                            <option value="">すべてのカテゴリー</option>
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <select class="form-select" id="productStatusFilter">
                                            <option value="">すべて</option>
                                            <option value="true">有効</option>
                                            <option value="false">無効</option>
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <button class="btn btn-primary w-100" onclick="searchProducts()">
                                            <i class="fas fa-search"></i> 検索
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Products Table -->
                        <div class="card">
                            <div class="card-body">
                                <div id="productsTable">
                                    <div class="text-center py-3">
                                        <div class="spinner-border" role="status"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Orders Section -->
                    <div id="orders" class="admin-section d-none">
                        <h2 class="mb-4"><i class="fas fa-shopping-cart"></i> 注文管理</h2>

                        <!-- Filter -->
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <select class="form-select" id="orderStatusFilter">
                                            <option value="">すべてのステータス</option>
                                            <option value="PENDING">注文確認中</option>
                                            <option value="CONFIRMED">確認済み</option>
                                            <option value="PROCESSING">処理中</option>
                                            <option value="SHIPPED">発送済み</option>
                                            <option value="DELIVERED">配達完了</option>
                                            <option value="CANCELLED">キャンセル</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <select class="form-select" id="orderPaymentFilter">
                                            <option value="">すべての支払い</option>
                                            <option value="PENDING">未払い</option>
                                            <option value="PAID">支払済み</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <button class="btn btn-primary w-100" onclick="filterOrders()">
                                            <i class="fas fa-filter"></i> フィルター
                                        </button>
                                    </div>
                                    <div class="col-md-2">
                                        <button class="btn btn-secondary w-100" onclick="loadAllOrders()">
                                            <i class="fas fa-redo"></i> リセット
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Orders Table -->
                        <div class="card">
                            <div class="card-body">
                                <div id="ordersTable">
                                    <div class="text-center py-3">
                                        <div class="spinner-border" role="status"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Categories Section -->
                    <div id="categories" class="admin-section d-none">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2><i class="fas fa-tags"></i> カテゴリー管理</h2>
                        </div>

                        <div class="card">
                            <div class="card-body">
                                <div id="categoriesTable">
                                    <div class="text-center py-3">
                                        <div class="spinner-border" role="status"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Reviews Section -->
                    <div id="reviews" class="admin-section d-none">
                        <h2 class="mb-4"><i class="fas fa-star"></i> レビュー管理</h2>

                        <!-- Filter -->
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <select class="form-select" id="reviewRatingFilter">
                                            <option value="">すべての評価</option>
                                            <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                                            <option value="4">⭐⭐⭐⭐ (4)</option>
                                            <option value="3">⭐⭐⭐ (3)</option>
                                            <option value="2">⭐⭐ (2)</option>
                                            <option value="1">⭐ (1)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <button class="btn btn-primary w-100" onclick="filterReviews()">
                                            <i class="fas fa-filter"></i> フィルター
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-body">
                                <div id="reviewsTable">
                                    <div class="text-center py-3">
                                        <div class="spinner-border" role="status"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <!-- Core Scripts -->
    <!-- Core Scripts -->
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/utils.js"></script>

    <!-- Components -->
    <script src="../../assets/js/components/header.js"></script>
    <script src="../../assets/js/components/footer.js"></script>

    <!-- Admin Page Script -->
    <script src="/assets/js/admin/admin.js"></script>
</body>

</html>
